# Example only: adjust SecretStore/ClusterSecretStore names to your installation.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backend-secret
  namespace: backend
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: backend-secret
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: ai-travel/backend
        property: DB_PASSWORD
    - secretKey: JWT_SECRET
      remoteRef:
        key: ai-travel/backend
        property: JWT_SECRET
